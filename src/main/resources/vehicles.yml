# Vehicle Manager Configuration
# Optimize and limit vehicles (boats, minecarts) to prevent lag.

enabled: true

# Limits
# Maximum vehicles per chunk. Excess vehicles will be prevented on spawn.
limits:
  minecarts:
    per-chunk: 8

  boats:
    per-chunk: 5

# Cleanup Settings
# Periodic cleanup of abandoned vehicles.
cleanup:
  # Enable automatic removal of abandoned vehicles
  remove-abandoned-vehicles: true

  # Time (seconds) a vehicle must be empty before considered abandoned
  abandoned-timeout-seconds: 300

  # Maximum vehicles to remove per cleanup cycle (prevents lag spikes)
  max-removals-per-cycle: 50

  # Cleanup task scheduling
  # Initial delay before first cleanup (ticks, 20 ticks = 1 second)
  initial-delay-ticks: 600
  # Interval between cleanup cycles (ticks, 6000 = 5 minutes)
  interval-ticks: 6000

  # Radius (blocks) around players where vehicles are protected from removal
  # Prevents removing vehicles that players might be actively using
  player-nearby-radius: 16

# Optimizations
optimization:
  # If true, vehicles without passengers that are not moving will stop processing physics/collision
  disable-physics-for-empty: true

  # Prevent collision checks for vehicles in full chunks
  reduce-collision-checks: true

# World Settings
disabled-worlds:
  - "creative_plot_world"
