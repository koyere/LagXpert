# Emergency Controller Configuration
# Reactive state machine that dynamically adjusts server limits based on
# real-time performance metrics (TPS, memory, player count).
#
# Replaces the old lagshield.yml, which is no longer used or shipped.
# Each server state applies different levels of corrective action.
#
# State progression: NORMAL → WARNING → CRITICAL → EMERGENCY
#   Escalation: 3 consecutive bad readings required
#   De-escalation: 5 consecutive good readings required
#   Minimum 10 seconds between state changes (prevents flapping)
#
# NOTE: this controller only evaluates while TPS monitoring is running. If you
# disable 'monitoring.tps.enabled' in monitoring.yml, no state changes occur and
# the server stays in NORMAL permanently.

enabled: true

# Stability settings — prevent false positives and flapping
stability:
  # Do not evaluate when no players are online (prevents false alarms during restarts)
  skip-when-no-players-online: true

  # Minimum consecutive bad readings before escalating
  escalation-confirmation-readings: 3

  # Minimum consecutive good readings before de-escalating
  de-escalation-confirmation-readings: 5

  # Minimum time (seconds) to stay in a state before transitioning
  min-state-duration-seconds: 10

  # Never go into EMERGENCY if fewer than this many players are online.
  # When there are fewer players than this, an EMERGENCY reading is capped
  # at CRITICAL instead — a nearly-empty server rarely warrants extreme measures.
  min-players-for-emergency: 5

  # If the server stays continuously in CRITICAL for this many seconds, it is
  # escalated to EMERGENCY even when the raw metrics never cross the emergency
  # thresholds. A server pinned at 12 TPS for two minutes is an emergency in
  # practice. Set to 0 to disable time-based escalation.
  sustained-critical-escalate-seconds: 120

# Performance thresholds that trigger state changes.
#
# Ordering matters. For TPS:  emergency < critical < warning <= recovery
#                   For RAM:  recovery <= warning < critical < emergency
# Misordered values make a tier unreachable; the plugin logs a warning on
# startup if it detects an ordering problem.
thresholds:
  tps:
    # TPS below this = consider EMERGENCY (most severe)
    emergency: 10.0
    # TPS below this = consider CRITICAL
    critical: 15.0
    # TPS below this = consider WARNING
    warning: 18.0
    # TPS above this AND RAM below recovery = consider NORMAL
    recovery: 19.0

  ram:
    # RAM usage above this = consider EMERGENCY (most severe)
    emergency: 95.0
    # RAM usage above this = consider CRITICAL
    critical: 90.0
    # RAM usage above this = consider WARNING
    warning: 85.0
    # RAM usage below this AND TPS above recovery = consider NORMAL
    recovery: 75.0

# Graduated responses applied in each server state
responses:
  # WARNING state — mild restrictions, mostly invisible to players
  warning:
    # Multiply mob limits by this value (0.75 = 75% of normal limit)
    mob-cap-multiplier: 0.75

    # Block natural mob spawning entirely
    block-natural-spawns: false

    # Force an immediate item cleanup cycle
    force-item-cleanup: false

    # Use aggressive chunk unloading (lower inactivity threshold)
    aggressive-chunk-unload: false

    # Pause chunk preloading to reduce I/O
    pause-chunk-preloader: true

    # Disable detected redstone clock circuits
    disable-redstone-clocks: false

    # Distance (blocks) threshold for AI optimization
    # Mobs farther than this from players get AI simplified/disabled
    ai-distance-threshold: 48

    # Broadcast state change to players with permission
    broadcast-alert: false

    # Override inactivity threshold for chunk unloading (minutes)
    unload-inactivity-minutes: 15

    # Disable AI on ALL mobs (extreme, use with caution)
    freeze-all-ai: false

  # CRITICAL state — significant restrictions, players will notice
  critical:
    mob-cap-multiplier: 0.5
    block-natural-spawns: true
    force-item-cleanup: true
    aggressive-chunk-unload: true
    unload-inactivity-minutes: 2
    pause-chunk-preloader: true
    disable-redstone-clocks: true
    ai-distance-threshold: 32
    broadcast-alert: true
    freeze-all-ai: false

  # EMERGENCY state — extreme measures, gameplay significantly affected
  emergency:
    mob-cap-multiplier: 0.25
    block-natural-spawns: true
    force-item-cleanup: true
    aggressive-chunk-unload: true
    unload-inactivity-minutes: 1
    pause-chunk-preloader: true
    disable-redstone-clocks: true
    ai-distance-threshold: 16
    broadcast-alert: true
    freeze-all-ai: false

    # Server commands to execute when entering EMERGENCY state
    # Use with caution — these run as console
    # Example:
    # emergency-commands:
    #   - "save-all"
    #   - "say &c[LagXpert] Emergency optimization active - expect reduced functionality"
    emergency-commands: []

# One-shot corrective actions performed on state transitions.
# These are executed by the response coordinator, separately from the
# continuous limit adjustments above.
actions:
  # Immediate off-cycle item cleanup when entering a state with
  # 'force-item-cleanup: true'. Skips the normal countdown warning.
  forced-item-cleanup:
    enabled: true
    # Minimum seconds between two forced cleanups. Prevents a flapping state
    # from stacking cleanup sweeps on top of each other.
    cooldown-seconds: 60

  # Controls which spawns are suppressed while a state has
  # 'block-natural-spawns: true'.
  #
  # Only environmental spawning pressure is listed by default. Player- and
  # plugin-driven spawns (SPAWNER_EGG, CUSTOM, BREEDING, COMMAND, DISPENSE_EGG,
  # BUILD_WITHER, BUILD_IRONGOLEM, ...) are deliberately absent: suppressing
  # those makes the server look broken rather than busy.
  #
  # Values are CreatureSpawnEvent.SpawnReason names. Unknown names are ignored,
  # so it is safe to keep entries that only exist on newer Minecraft versions.
  # Players with 'lagxpert.bypass.mobs' in the chunk are always exempt.
  block-natural-spawns:
    spawn-reasons:
      - NATURAL
      - SPAWNER
      - CHUNK_GEN
      - REINFORCEMENTS
      - VILLAGE_INVASION
      - VILLAGE_DEFENSE
      - PATROL
      - RAID
      - SILVERFISH_BLOCK
      - TRAP
      - NETHER_PORTAL
      - JOCKEY
      - MOUNT
      - LIGHTNING
      - SLIME_SPLIT
      - DROWNED
      - INFECTION
      - FROZEN
      - SPELL
      - ENDER_PEARL

  # Server-wide mob AI freeze when entering a state with 'freeze-all-ai: true'.
  # Lifted automatically on recovery. Mobs disabled by the type/world rules in
  # mobs.yml stay disabled when the freeze is lifted.
  ai-freeze:
    enabled: true

# Recovery settings — when to return to NORMAL
recovery:
  # Automatically de-escalate when metrics improve
  auto-de-escalate: true

  # Broadcast recovery message to players
  broadcast-recovery: true

# Manual override controls
manual:
  # Allow admins to force-return to NORMAL state via /lagxpert emergency force-normal
  allow-force-normal: true

  # Permission required for manual override
  force-normal-permission: "lagxpert.admin.emergency"
